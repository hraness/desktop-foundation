[workspace]
members = [".", "crates/hraness-cli-kit", "crates/hraness-local-app", "crates/hraness-control-kit"]

[package]
name = "desktop-foundation"
version = "1.1.1"
description = "The one-shot helper (hraness-helper, with its hraness-companion alias) and control kit for Hraness CLI products on macOS, Windows, and Linux"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[dependencies]
hraness-cli-kit = { version = "1.1.1", path = "crates/hraness-cli-kit" }
hraness-local-app = { version = "1.1.1", path = "crates/hraness-local-app" }

# The one-shot helper. Since 1.0 there is no tray and no Tauri.
[[bin]]
name = "hraness-helper"
path = "src/bin/hraness-helper.rs"

# The 0.x name, kept as an alias: the same one-shot modes as
# `hraness-helper`, and a `tray-removed` refusal for the old menu-bar argv.
[[bin]]
name = "hraness-companion"
path = "src/bin/hraness-companion.rs"

[[test]]
name = "helper_argv"
path = "tests/helper_argv.rs"

[dev-dependencies]
regex = "1"
serde_json = "1.0"
