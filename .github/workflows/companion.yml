name: Companion
on:
  push:
    # main runs warm the shared Cargo caches that every pull request restores
    # and rerun the same gate after integration.
    branches: [main]
    tags: ['v*']
  pull_request:
  # Pull requests run all six targets only when they touch platform code (see
  # scripts/native-scope.mjs). Main, this nightly run, manual runs and tags
  # always run every target, and a red main run opens a tracking issue.
  # GitHub disables schedules on public repositories after 60 days without
  # activity; main pushes keep it alive, and a long-quiet repo should check
  # the Actions tab before relying on the nightly run.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request supersedes its older run. Every other run
# gets one group per event, ref and SHA, so a main run is never queued behind
# or cancelled by a later merge or the nightly run, and a tag never waits for
# the main run of the same commit.
concurrency:
  group: companion-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # docs: every changed file is documentation; no native legs or package.
      # subset: platform-neutral changes; Linux x64, macOS arm64, Windows x64.
      # full: all six targets and the package. Non-PR runs are always full.
      scope: ${{ steps.scope.outputs.scope }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The merge commit and its base parent: HEAD^1..HEAD is the change.
          fetch-depth: 2
      - name: Select native scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          full='[
            {"os":"macos-14","target":"aarch64-apple-darwin"},
            {"os":"macos-15-intel","target":"x86_64-apple-darwin"},
            {"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},
            {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"os":"windows-2022","target":"x86_64-pc-windows-msvc"},
            {"os":"windows-11-vs2026-arm","target":"aarch64-pc-windows-msvc"}
          ]'
          scope=full
          if [ "$EVENT_NAME" = pull_request ]; then
            # Run the base commit's selector, so an edit to the selector alone
            # cannot narrow its own pull request's matrix (workflow edits are
            # reviewed as usual). Any failure, including a missing selector,
            # leaves the scope at full.
            if git rev-parse --verify --quiet 'HEAD^2' >/dev/null \
              && git show 'HEAD^1:scripts/native-scope.mjs' > "$RUNNER_TEMP/native-scope.mjs" \
              && picked=$(node "$RUNNER_TEMP/native-scope.mjs" 'HEAD^1' HEAD); then
              case "$picked" in docs|subset|full) scope=$picked ;; esac
            fi
          fi
          if [ "$scope" = subset ]; then
            matrix=$(jq -c '[.[] | select(.target == "x86_64-unknown-linux-gnu" or .target == "aarch64-apple-darwin" or .target == "x86_64-pc-windows-msvc")]' <<< "$full")
          else
            matrix=$(jq -c . <<< "$full")
          fi
          echo "Native scope: $scope" >> "$GITHUB_STEP_SUMMARY"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  sdk:
    name: SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:sdk
  cli-kit:
    # std only: no GTK or WebKit, so one Linux job covers it. The tests read
    # the SDK golden files and docs/permissions.md, so a docs change runs it.
    name: CLI kit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli-kit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p hraness-cli-kit --check
      - run: cargo clippy -p hraness-cli-kit --locked --all-features --all-targets -- -D warnings
      - run: cargo test -p hraness-cli-kit --locked --all-features
      # The default build has no clap; make sure it stands alone.
      - run: cargo test -p hraness-cli-kit --locked --lib
  control-kit:
    # The headless control crates. control-kit is std-only; local-app is
    # POSIX-only with no WebKit, Tauri or GTK. The tests read contract/ and
    # the SDK goldens, so a docs change runs it.
    name: Control kit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: control-kit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p hraness-control-kit -p hraness-local-app --check
      - run: cargo clippy -p hraness-control-kit -p hraness-local-app --locked --all-features --all-targets -- -D warnings
      - run: cargo test -p hraness-control-kit -p hraness-local-app --locked --all-features
      # Feature matrix: the envelope and registry stand alone without the
      # owner process.
      - run: cargo test -p hraness-control-kit --locked
      - run: cargo test -p hraness-control-kit --locked --no-default-features --lib
  native:
    outputs:
      aarch64_apple_darwin_artifact_id: ${{ steps.producer.outputs.aarch64_apple_darwin_artifact_id }}
      aarch64_apple_darwin_artifact_digest: ${{ steps.producer.outputs.aarch64_apple_darwin_artifact_digest }}
      x86_64_apple_darwin_artifact_id: ${{ steps.producer.outputs.x86_64_apple_darwin_artifact_id }}
      x86_64_apple_darwin_artifact_digest: ${{ steps.producer.outputs.x86_64_apple_darwin_artifact_digest }}
      x86_64_pc_windows_msvc_artifact_id: ${{ steps.producer.outputs.x86_64_pc_windows_msvc_artifact_id }}
      x86_64_pc_windows_msvc_artifact_digest: ${{ steps.producer.outputs.x86_64_pc_windows_msvc_artifact_digest }}
      aarch64_pc_windows_msvc_artifact_id: ${{ steps.producer.outputs.aarch64_pc_windows_msvc_artifact_id }}
      aarch64_pc_windows_msvc_artifact_digest: ${{ steps.producer.outputs.aarch64_pc_windows_msvc_artifact_digest }}
      x86_64_unknown_linux_gnu_artifact_id: ${{ steps.producer.outputs.x86_64_unknown_linux_gnu_artifact_id }}
      x86_64_unknown_linux_gnu_artifact_digest: ${{ steps.producer.outputs.x86_64_unknown_linux_gnu_artifact_digest }}
      aarch64_unknown_linux_gnu_artifact_id: ${{ steps.producer.outputs.aarch64_unknown_linux_gnu_artifact_id }}
      aarch64_unknown_linux_gnu_artifact_digest: ${{ steps.producer.outputs.aarch64_unknown_linux_gnu_artifact_digest }}
    name: Native (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.scope == 'subset' || needs.changes.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        # All six targets, or one per OS family (Linux x64, macOS arm64,
        # Windows x64) for a subset PR.
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # fmt and clippy for the root crate run once, on the Linux x64 leg.
          components: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          # Only main writes the cache; pull requests and tags restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci --ignore-scripts
      # The SDK tests branch on the host platform, so every leg builds and
      # tests the SDK once.
      - run: npm run check:sdk
      # One profile for the whole leg: the tests compile the same optimized
      # dependency tree the shipped binary uses, so nothing is built twice.
      - name: Native Rust tests
        id: native_tests
        run: cargo test --locked --release
      # The root crate's style and lint gate. The kits run theirs in their own
      # jobs; this leg is ~3 min shorter than the slowest leg, so it adds no
      # wall-clock. --release shares build scripts and proc-macros with the tests.
      - name: Root crate fmt and clippy (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --all --check
          cargo clippy -p desktop-foundation --locked --release --all-targets -- -D warnings
      # Auxiliary evidence must not replace or mask the required Rust test result.
      - name: Diagnose Windows native imports and manifests
        continue-on-error: true
        if: always() && runner.os == 'Windows' && steps.native_tests.outcome != 'skipped'
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/windows-loader-diagnostics.ps1
      - name: Preserve Windows loader evidence
        continue-on-error: true
        if: always() && runner.os == 'Windows' && steps.native_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: loader-${{ matrix.target }}
          path: target/windows-loader-diagnostics/*
          if-no-files-found: warn
          retention-days: 7
      # Reuses the release artifacts the test build just produced. The
      # fingerprint log names the reason if cargo recompiles anything here.
      - name: Build shipping binaries
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          cargo build --locked --release --bin hraness-companion --bin hraness-helper 2> "$RUNNER_TEMP/build.log" || { cat "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E 'dirty|Compiling|Finished' "$RUNNER_TEMP/build.log" | head -40 || true
          grep -E -A6 '^warning' "$RUNNER_TEMP/build.log" | head -80 || true
      # The alias answers every one-shot argv like the helper and refuses the
      # removed menu-bar argv; nothing here opens a window.
      - name: Companion alias smoke
        run: node scripts/alias-smoke.mjs target/release
      - name: Collect raw executable
        shell: bash
        env:
          COMPANION_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          extension=''
          if [[ "$COMPANION_TARGET" == *windows* ]]; then extension='.exe'; fi
          cp "target/release/hraness-companion$extension" "artifacts/hraness-companion-$COMPANION_TARGET$extension"
          cp "target/release/hraness-helper$extension" "artifacts/hraness-helper-$COMPANION_TARGET$extension"
      # Ad-hoc signature only: no identity, no notarization. Apple Silicon
      # refuses unsigned arm64 code, and this keeps the helper's code
      # directory stable for the person's own OS approval.
      - name: Ad-hoc sign the helper (macOS)
        if: runner.os == 'macOS'
        env:
          COMPANION_TARGET: ${{ matrix.target }}
        run: |
          codesign --force --sign - "artifacts/hraness-helper-$COMPANION_TARGET"
          codesign --verify --verbose=2 "artifacts/hraness-helper-$COMPANION_TARGET"
      - name: Record ABI and build evidence
        env:
          COMPANION_TARGET: ${{ matrix.target }}
        run: node scripts/artifact-evidence.mjs
      - id: native_artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
      - name: Export immutable artifact identity for this matrix target
        id: producer
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_ID: ${{ steps.native_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.native_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          case "$TARGET" in aarch64-apple-darwin|x86_64-apple-darwin|x86_64-pc-windows-msvc|aarch64-pc-windows-msvc|x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu) ;; *) exit 1 ;; esac
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          key="${TARGET//-/_}"
          printf '%s_artifact_id=%s\n%s_artifact_digest=%s\n' "$key" "$ARTIFACT_ID" "$key" "$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
  release_identity:
    name: Admit the exact release source
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-tags: false
      - id: identity
        run: python3 -I scripts/macos-release-artifacts.py qualify
  macos_sign:
    name: Sign and notarize the four Mac release executables
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [release_identity, native, sdk, cli-kit, control-kit]
    # Only release tags may enter this environment. No reviewers or timers.
    # Build, test, and package jobs never receive these Apple credentials.
    environment: hraness-apple-release
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
      artifact_digest: ${{ steps.signed.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.signed_bytes.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_identity.outputs.sha }}
          persist-credentials: false
          fetch-tags: false
      - name: Download and bind exact same-run Mac build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          AARCH64_APPLE_DARWIN_ARTIFACT_ID: ${{ needs.native.outputs.aarch64_apple_darwin_artifact_id }}
          AARCH64_APPLE_DARWIN_ARTIFACT_DIGEST: ${{ needs.native.outputs.aarch64_apple_darwin_artifact_digest }}
          X86_64_APPLE_DARWIN_ARTIFACT_ID: ${{ needs.native.outputs.x86_64_apple_darwin_artifact_id }}
          X86_64_APPLE_DARWIN_ARTIFACT_DIGEST: ${{ needs.native.outputs.x86_64_apple_darwin_artifact_digest }}
        run: python3 -I scripts/macos-release-artifacts.py fetch-native "$RUNNER_TEMP/desktop-foundation-native"
      - name: Sign and notarize without executing any payload
        env:
          RELEASE_TAG: ${{ needs.release_identity.outputs.tag }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 -I scripts/sign-macos-release.py sign "$RUNNER_TEMP/desktop-foundation-native" "$RELEASE_TAG" "$GITHUB_WORKSPACE/signed-artifacts" "$RUNNER_TEMP/desktop-foundation-apple-signing"
      - name: Remove isolated signing credentials on every outcome
        if: always()
        run: python3 -I scripts/sign-macos-release.py cleanup "$RUNNER_TEMP/desktop-foundation-apple-signing"
      - name: Bind exact signed receipt before publishing artifacts
        id: signed_bytes
        run: |
          set -euo pipefail
          test -f signed-artifacts/macos-signing.json && test ! -L signed-artifacts/macos-signing.json
          printf 'receipt_sha256=%s\n' "$(shasum -a 256 signed-artifacts/macos-signing.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: signed
        uses: actions/upload-artifact@v7
        with:
          name: macos-signed-${{ github.run_attempt }}
          path: signed-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve bounded notarization status for reconciliation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-notarization-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-foundation-apple-notarization.json
          if-no-files-found: warn
          retention-days: 30
  package:
    outputs:
      artifact_id: ${{ steps.distribution.outputs.artifact-id }}
      artifact_digest: ${{ steps.distribution.outputs.artifact-digest }}
    # The manifest and package need all six binaries, so only full runs.
    needs: [changes, sdk, native, macos_sign]
    if: always() && needs.changes.outputs.scope == 'full' && needs.sdk.result == 'success' && needs.native.result == 'success' && (needs.macos_sign.result == 'success' || (needs.macos_sign.result == 'skipped' && !(github.event_name == 'push' && github.ref_type == 'tag')))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Fetch exact native producer artifacts, including successful earlier attempts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_WORKFLOW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AARCH64_APPLE_DARWIN_ARTIFACT_ID: ${{ needs.native.outputs.aarch64_apple_darwin_artifact_id }}
          AARCH64_APPLE_DARWIN_ARTIFACT_DIGEST: ${{ needs.native.outputs.aarch64_apple_darwin_artifact_digest }}
          X86_64_APPLE_DARWIN_ARTIFACT_ID: ${{ needs.native.outputs.x86_64_apple_darwin_artifact_id }}
          X86_64_APPLE_DARWIN_ARTIFACT_DIGEST: ${{ needs.native.outputs.x86_64_apple_darwin_artifact_digest }}
          X86_64_PC_WINDOWS_MSVC_ARTIFACT_ID: ${{ needs.native.outputs.x86_64_pc_windows_msvc_artifact_id }}
          X86_64_PC_WINDOWS_MSVC_ARTIFACT_DIGEST: ${{ needs.native.outputs.x86_64_pc_windows_msvc_artifact_digest }}
          AARCH64_PC_WINDOWS_MSVC_ARTIFACT_ID: ${{ needs.native.outputs.aarch64_pc_windows_msvc_artifact_id }}
          AARCH64_PC_WINDOWS_MSVC_ARTIFACT_DIGEST: ${{ needs.native.outputs.aarch64_pc_windows_msvc_artifact_digest }}
          X86_64_UNKNOWN_LINUX_GNU_ARTIFACT_ID: ${{ needs.native.outputs.x86_64_unknown_linux_gnu_artifact_id }}
          X86_64_UNKNOWN_LINUX_GNU_ARTIFACT_DIGEST: ${{ needs.native.outputs.x86_64_unknown_linux_gnu_artifact_digest }}
          AARCH64_UNKNOWN_LINUX_GNU_ARTIFACT_ID: ${{ needs.native.outputs.aarch64_unknown_linux_gnu_artifact_id }}
          AARCH64_UNKNOWN_LINUX_GNU_ARTIFACT_DIGEST: ${{ needs.native.outputs.aarch64_unknown_linux_gnu_artifact_digest }}
        run: python3 -I scripts/macos-release-artifacts.py fetch-builds artifacts
      - name: Replace Mac artifacts with the exact notarized signing output
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_ARTIFACT_ID: ${{ needs.macos_sign.outputs.artifact_id }}
          SIGNED_ARTIFACT_DIGEST: ${{ needs.macos_sign.outputs.artifact_digest }}
        run: python3 -I scripts/macos-release-artifacts.py fetch-signed artifacts
      - run: npm ci --ignore-scripts
      # The SDK tests already ran on this tree in the sdk job and on every
      # native leg; packaging only needs the compiled dist.
      - run: npm run build:sdk
      - run: node scripts/release-manifest.mjs
      - name: Package verified SDK and pinned manifest
        run: npm pack --ignore-scripts --pack-destination artifacts
      - name: Recheck exact signed bytes before immutable package upload
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          SIGNED_RECEIPT_SHA256: ${{ needs.macos_sign.outputs.receipt_sha256 }}
        run: python3 -I scripts/macos-release-artifacts.py verify-stage artifacts
      - id: distribution
        uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
  package_smoke:
    name: Smoke the immutable distribution on a separate runner
    needs: [package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download exact package job artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          DISTRIBUTION_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
          ARTIFACT_WORKFLOW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -I scripts/macos-release-artifacts.py fetch-distribution artifacts
      # No Apple credentials, publication authority, or artifact upload in this
      # payload-executing job. Mutations cannot reach the immutable release.
      - name: Smoke test the installed SDK tarball
        run: node scripts/package-smoke.mjs
  required:
    name: Required
    if: always()
    needs: [changes, sdk, cli-kit, control-kit, native, release_identity, macos_sign, package, package_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every blocking job passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
          CLI_KIT_RESULT: ${{ needs.cli-kit.result }}
          CONTROL_KIT_RESULT: ${{ needs.control-kit.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package_smoke.result }}
          RELEASE_REQUEST: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          IDENTITY_RESULT: ${{ needs.release_identity.result }}
          SIGNING_RESULT: ${{ needs.macos_sign.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$SDK_RESULT" = success
          test "$CLI_KIT_RESULT" = success
          test "$CONTROL_KIT_RESULT" = success
          if [ "$RELEASE_REQUEST" = true ]; then
            test "$IDENTITY_RESULT" = success
            test "$SIGNING_RESULT" = success
          else
            test "$IDENTITY_RESULT" = skipped
            test "$SIGNING_RESULT" = skipped
          fi
          # Only a pull request may narrow the matrix.
          if [ "$EVENT_NAME" != pull_request ]; then test "$SCOPE" = full; fi
          case "$SCOPE" in
            # A docs-only pull request deliberately skips the native matrix.
            docs) test "$NATIVE_RESULT" = skipped && test "$PACKAGE_RESULT" = skipped && test "$PACKAGE_SMOKE_RESULT" = skipped ;;
            # Three targets passed; the package needs all six and waits for main.
            subset) test "$NATIVE_RESULT" = success && test "$PACKAGE_RESULT" = skipped && test "$PACKAGE_SMOKE_RESULT" = skipped ;;
            full) test "$NATIVE_RESULT" = success && test "$PACKAGE_RESULT" = success && test "$PACKAGE_SMOKE_RESULT" = success ;;
            *) echo "unknown native scope: $SCOPE"; exit 1 ;;
          esac
  main-health:
    # A pull request can skip four targets, so main is where a platform-only
    # break first shows. A red full run on main opens (or comments on) one
    # tracking issue; the next green one closes it. A cancelled nightly run
    # counts as red, so the nightly cannot go quiet by being cancelled.
    name: Main health
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.required.result == 'success' || needs.required.result == 'failure' || (github.event_name == 'schedule' && needs.required.result == 'cancelled'))
    needs: [required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.required.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          title='Companion: full native matrix is failing on main'
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ "$RESULT" = failure ] || [ "$RESULT" = cancelled ]; then
            body="The $EVENT_NAME run for $SHA ended $RESULT: $RUN_URL"
            if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"
            else gh issue create --title "$title" --body "$body"; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The $EVENT_NAME run for $SHA passed: $RUN_URL"
          fi
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: [required, macos_sign, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      # The notes come from CHANGELOG.md at the tagged commit.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the same immutable distribution that passed package smoke
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          DISTRIBUTION_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
        run: python3 -I scripts/macos-release-artifacts.py fetch-distribution artifacts
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - name: Render release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" "$RELEASE_COMMIT" > "$RUNNER_TEMP/notes.md"
      - name: Publish new versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          SIGNED_RECEIPT_SHA256: ${{ needs.macos_sign.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          python3 -I scripts/macos-release-artifacts.py verify-stage artifacts
          python3 -I scripts/macos-release-artifacts.py verify-tag
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "desktop-foundation $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
  crates:
    name: Publish CLI kit to crates.io
    needs: [required, release]
    concurrency:
      group: crates-io-hraness-cli-kit
      cancel-in-progress: false
    if: startsWith(github.ref, 'refs/tags/v') && vars.CRATES_IO_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify publication identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          package = tomllib.loads(Path('crates/hraness-cli-kit/Cargo.toml').read_text())['package']
          root = tomllib.loads(Path('Cargo.toml').read_text())['package']
          assert package['name'] == 'hraness-cli-kit'
          assert package['version'] == root['version']
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', package['version'])
          print(package['version'])
          PY
          )
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch --no-tags --unshallow origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          status=$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/crate.json" \
            --write-out '%{http_code}' "https://crates.io/api/v1/crates/hraness-cli-kit/$version")
          case "$status" in
            200) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            404)
              curl --fail --silent --show-error --retry 3 \
                'https://crates.io/api/v1/crates/hraness-cli-kit' > "$RUNNER_TEMP/crate-latest.json"
              python3 - "$version" "$RUNNER_TEMP/crate-latest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          latest = json.loads(Path(sys.argv[2]).read_text())['crate']['max_stable_version']
          if latest is not None:
              assert tuple(map(int, sys.argv[1].split('.'))) > tuple(map(int, latest.split('.'))), 'refusing an older crate version'
          PY
              echo 'publish=true' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::crates.io version lookup returned HTTP $status"; exit 1 ;;
          esac
      - name: Package the expected registry archive
        id: archive
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          cargo +1.97.1 package --locked -p hraness-cli-kit
          checksum=$(sha256sum "target/package/hraness-cli-kit-$VERSION.crate" | cut -d' ' -f1)
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
      - name: Verify an existing registry archive
        if: steps.identity.outputs.publish == 'false'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        run: node scripts/verify-crate-registry.mjs hraness-cli-kit "$VERSION" "$CHECKSUM" "$RUNNER_TEMP/crate.json"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.identity.outputs.publish == 'true'
        id: auth
      - name: Publish the verified crate
        if: steps.identity.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.97.1 publish --locked -p hraness-cli-kit
      - name: Verify the registry version
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            if curl --fail --silent --show-error \
              "https://crates.io/api/v1/crates/hraness-cli-kit/$VERSION" > "$RUNNER_TEMP/published-crate.json"; then
              node scripts/verify-crate-registry.mjs hraness-cli-kit "$VERSION" "$CHECKSUM" "$RUNNER_TEMP/published-crate.json"
              exit 0
            fi
            sleep 5
          done
          echo "::error::crates.io does not report hraness-cli-kit $VERSION"
          exit 1
