[package]
name = "hraness-control-kit"
version = "2.0.0"
description = "Headless control for Hraness products: JSON envelope and exit codes, verb registry, owner process with Unix control sockets, and the human gate"
edition = "2021"
# std File::try_lock for the supervisor lock.
rust-version = "1.89"
license = "MIT"
publish = false

[features]
default = ["std"]
# The owner process, sockets and the human gate. Without it the crate has
# only the envelope, error codes and registry.
std = ["dep:rustix", "dep:getrandom"]
clap = ["dep:clap"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
getrandom = { version = "0.3", optional = true }
clap = { version = "4.5", optional = true, default-features = false, features = ["std", "string", "help", "usage", "error-context"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", optional = true, features = ["termios", "process", "event", "fs"] }
