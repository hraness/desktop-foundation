name: Companion
on:
  push:
    # main runs warm the shared Cargo caches that every pull request restores
    # and rerun the same gate after integration.
    branches: [main]
    tags: ['v*']
  pull_request:
  # Pull requests run all six targets only when they touch platform code (see
  # scripts/native-scope.mjs). Main, this nightly run, manual runs and tags
  # always run every target, and a red main run opens a tracking issue.
  # GitHub disables schedules on public repositories after 60 days without
  # activity; main pushes keep it alive, and a long-quiet repo should check
  # the Actions tab before relying on the nightly run.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request supersedes its older run. Every other run
# gets one group per event, ref and SHA, so a main run is never queued behind
# or cancelled by a later merge or the nightly run, and a tag never waits for
# the main run of the same commit.
concurrency:
  group: companion-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # docs: every changed file is documentation; no native legs or package.
      # subset: platform-neutral changes; Linux x64, macOS arm64, Windows x64.
      # full: all six targets and the package. Non-PR runs are always full.
      scope: ${{ steps.scope.outputs.scope }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The merge commit and its base parent: HEAD^1..HEAD is the change.
          fetch-depth: 2
      - name: Select native scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          full='[
            {"os":"macos-14","target":"aarch64-apple-darwin"},
            {"os":"macos-15-intel","target":"x86_64-apple-darwin"},
            {"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},
            {"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"os":"windows-2022","target":"x86_64-pc-windows-msvc"},
            {"os":"windows-11-vs2026-arm","target":"aarch64-pc-windows-msvc"}
          ]'
          scope=full
          if [ "$EVENT_NAME" = pull_request ]; then
            # Run the base commit's selector, so an edit to the selector alone
            # cannot narrow its own pull request's matrix (workflow edits are
            # reviewed as usual). Any failure, including a missing selector,
            # leaves the scope at full.
            if git rev-parse --verify --quiet 'HEAD^2' >/dev/null \
              && git show 'HEAD^1:scripts/native-scope.mjs' > "$RUNNER_TEMP/native-scope.mjs" \
              && picked=$(node "$RUNNER_TEMP/native-scope.mjs" 'HEAD^1' HEAD); then
              case "$picked" in docs|subset|full) scope=$picked ;; esac
            fi
          fi
          if [ "$scope" = subset ]; then
            matrix=$(jq -c '[.[] | select(.target == "x86_64-unknown-linux-gnu" or .target == "aarch64-apple-darwin" or .target == "x86_64-pc-windows-msvc")]' <<< "$full")
          else
            matrix=$(jq -c . <<< "$full")
          fi
          echo "Native scope: $scope" >> "$GITHUB_STEP_SUMMARY"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  sdk:
    name: SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:sdk
  cli-kit:
    # std only: no GTK or WebKit, so one Linux job covers it. The tests read
    # the SDK golden files and docs/permissions.md, so a docs change runs it.
    name: CLI kit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli-kit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p hraness-cli-kit --check
      - run: cargo clippy -p hraness-cli-kit --locked --all-features --all-targets -- -D warnings
      - run: cargo test -p hraness-cli-kit --locked --all-features
      # The default build has no clap; make sure it stands alone.
      - run: cargo test -p hraness-cli-kit --locked --lib
  control-kit:
    # The headless control crates. control-kit is std-only with optional
    # ratatui; local-app links GTK on Linux but no WebKit or Tauri. The tests
    # read contract/ and the SDK goldens, so a docs change runs it.
    name: Control kit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: control-kit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - run: cargo fmt -p hraness-control-kit -p hraness-local-app --check
      - run: cargo clippy -p hraness-control-kit -p hraness-local-app --locked --all-features --all-targets -- -D warnings
      - run: cargo test -p hraness-control-kit -p hraness-local-app --locked --all-features
      # Feature matrix: the default build has no TUI, and the envelope and
      # registry stand alone without the owner process.
      - run: cargo test -p hraness-control-kit --locked
      - run: cargo test -p hraness-control-kit --locked --no-default-features --lib
  native:
    name: Native (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.scope == 'subset' || needs.changes.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        # All six targets, or one per OS family (Linux x64, macOS arm64,
        # Windows x64) for a subset PR.
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # fmt and clippy for the root crate run once, on the Linux x64 leg.
          components: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          # Only main writes the cache; pull requests and tags restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # GTK for the one-shot dialogs; Xvfb and D-Bus give the prompt smoke a
      # display. No WebKit or tray libraries since 1.0.
      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb dbus-x11
      - run: npm ci --ignore-scripts
      # The SDK tests branch on the host platform, so every leg builds and
      # tests the SDK once.
      - run: npm run check:sdk
      # One profile for the whole leg: the tests compile the same optimized
      # dependency tree the shipped binary uses, so nothing is built twice.
      - name: Native Rust tests
        id: native_tests
        run: cargo test --locked --release
      # The root crate's style and lint gate. The kits run theirs in their own
      # jobs; this leg is ~3 min shorter than the slowest leg, so it adds no
      # wall-clock. --release shares build scripts and proc-macros with the tests.
      - name: Root crate fmt and clippy (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --all --check
          cargo clippy -p desktop-foundation --locked --release --all-targets -- -D warnings
      # Auxiliary evidence must not replace or mask the required Rust test result.
      - name: Diagnose Windows native imports and manifests
        continue-on-error: true
        if: always() && runner.os == 'Windows' && steps.native_tests.outcome != 'skipped'
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/windows-loader-diagnostics.ps1
      - name: Preserve Windows loader evidence
        continue-on-error: true
        if: always() && runner.os == 'Windows' && steps.native_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: loader-${{ matrix.target }}
          path: target/windows-loader-diagnostics/*
          if-no-files-found: warn
          retention-days: 7
      # Reuses the release artifacts the test build just produced. The
      # fingerprint log names the reason if cargo recompiles anything here.
      - name: Build shipping binaries
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          cargo build --locked --release --bin hraness-companion --bin hraness-helper 2> "$RUNNER_TEMP/build.log" || { cat "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E 'dirty|Compiling|Finished' "$RUNNER_TEMP/build.log" | head -40 || true
          grep -E -A6 '^warning' "$RUNNER_TEMP/build.log" | head -80 || true
      # The alias answers every one-shot argv like the helper and refuses the
      # removed menu-bar argv; nothing here opens a window.
      - name: Companion alias smoke
        run: node scripts/alias-smoke.mjs target/release
      # The one-shot prompt and notice on hraness-helper. A host without a
      # desktop must answer "unavailable" to match its capability probe.
      - name: Native prompt smoke (macOS and Windows)
        if: runner.os != 'Linux'
        run: node scripts/prompt-smoke.mjs
      - name: Native prompt smoke (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/prompt-smoke.mjs
      - name: Collect raw executable
        shell: bash
        env:
          COMPANION_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          extension=''
          if [[ "$COMPANION_TARGET" == *windows* ]]; then extension='.exe'; fi
          cp "target/release/hraness-companion$extension" "artifacts/hraness-companion-$COMPANION_TARGET$extension"
          cp "target/release/hraness-helper$extension" "artifacts/hraness-helper-$COMPANION_TARGET$extension"
      # Ad-hoc signature only: no identity, no notarization. Apple Silicon
      # refuses unsigned arm64 code, and this keeps the helper's code
      # directory stable for the person's own OS approval.
      - name: Ad-hoc sign the helper (macOS)
        if: runner.os == 'macOS'
        env:
          COMPANION_TARGET: ${{ matrix.target }}
        run: |
          codesign --force --sign - "artifacts/hraness-helper-$COMPANION_TARGET"
          codesign --verify --verbose=2 "artifacts/hraness-helper-$COMPANION_TARGET"
      - name: Record ABI and build evidence
        env:
          COMPANION_TARGET: ${{ matrix.target }}
        run: node scripts/artifact-evidence.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
  package:
    # The manifest and package need all six binaries, so only full runs.
    needs: [changes, sdk, native]
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      # The package smoke runs the Linux binaries, which link GTK for the
      # dialogs. Runtime packages only, no -dev.
      - name: Install runner runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0
      - run: npm ci --ignore-scripts
      # The SDK tests already ran on this tree in the sdk job and on every
      # native leg; packaging only needs the compiled dist.
      - run: npm run build:sdk
      - run: node scripts/release-manifest.mjs
      - name: Package verified SDK and pinned manifest
        run: npm pack --ignore-scripts --pack-destination artifacts
      - name: Smoke test the installed SDK tarball
        run: node scripts/package-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: artifacts/*
          if-no-files-found: error
  required:
    name: Required
    if: always()
    needs: [changes, sdk, cli-kit, control-kit, native, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every blocking job passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
          CLI_KIT_RESULT: ${{ needs.cli-kit.result }}
          CONTROL_KIT_RESULT: ${{ needs.control-kit.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$SDK_RESULT" = success
          test "$CLI_KIT_RESULT" = success
          test "$CONTROL_KIT_RESULT" = success
          # Only a pull request may narrow the matrix.
          if [ "$EVENT_NAME" != pull_request ]; then test "$SCOPE" = full; fi
          case "$SCOPE" in
            # A docs-only pull request deliberately skips the native matrix.
            docs) test "$NATIVE_RESULT" = skipped && test "$PACKAGE_RESULT" = skipped ;;
            # Three targets passed; the package needs all six and waits for main.
            subset) test "$NATIVE_RESULT" = success && test "$PACKAGE_RESULT" = skipped ;;
            full) test "$NATIVE_RESULT" = success && test "$PACKAGE_RESULT" = success ;;
            *) echo "unknown native scope: $SCOPE"; exit 1 ;;
          esac
  main-health:
    # A pull request can skip four targets, so main is where a platform-only
    # break first shows. A red full run on main opens (or comments on) one
    # tracking issue; the next green one closes it. A cancelled nightly run
    # counts as red, so the nightly cannot go quiet by being cancelled.
    name: Main health
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.required.result == 'success' || needs.required.result == 'failure' || (github.event_name == 'schedule' && needs.required.result == 'cancelled'))
    needs: [required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.required.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          title='Companion: full native matrix is failing on main'
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ "$RESULT" = failure ] || [ "$RESULT" = cancelled ]; then
            body="The $EVENT_NAME run for $SHA ended $RESULT: $RUN_URL"
            if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"
            else gh issue create --title "$title" --body "$body"; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The $EVENT_NAME run for $SHA passed: $RUN_URL"
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [required]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The notes come from CHANGELOG.md at the tagged commit.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: artifacts
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - name: Render release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" "$RELEASE_COMMIT" > "$RUNNER_TEMP/notes.md"
      - name: Publish new versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "desktop-foundation $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
