[package]
name = "hraness-local-app"
version = "2.0.0"
description = "Hraness local app on the person's own Mac: assembly, signing, --launch, and login items. No Tauri."
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[dependencies]
fs2 = "0.4.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
